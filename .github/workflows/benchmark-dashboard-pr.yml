on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      uv-groups:
        type: string
        required: true
        description: "Space-separated uv dependency groups"
      cov:
        type: string
        required: true
        description: "pytest --cov target"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: apifornia-builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linters
            run: uv run pre-commit run --all-files
          - name: vulture
            run: uv run pre-commit run vulture --all-files --hook-stage manual
          - name: dead-fixtures
            run: uv run pre-commit run dead-fixtures --all-files --hook-stage manual
          - name: tests
            run: uv run pytest -m unit -v --cov=${{ inputs.cov }} --cov-report=term-missing
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Sync dependencies
        env:
          UV_GROUPS: ${{ inputs.uv-groups }}
        run: |
          set -eu
          cmd=(uv sync)
          for g in $UV_GROUPS; do
            cmd+=(--group "$g")
          done
          "${cmd[@]}"
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
